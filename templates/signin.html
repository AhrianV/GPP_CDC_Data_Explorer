<!-- Sign In page template -->
{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/signin.js') }}" defer></script>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <h1>Sign In</h1>

            <form class="mt-5" id="signin-form" method="POST" action="{{ url_for('signin') }}" style="background-color: #ECF5F4;">
                

                <div class="mb-3">
            {% if rate_limit_message %}<div class="alert alert-warning" role="alert">{{ rate_limit_message }}</div>{% endif %}
            <p>Sign in to your account below! Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>.</p>

            <form class="mt-5" method="POST" action="{{ url_for('signin') }}" style="background-color: #ECF5F4;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Enter a Username or Email" autocomplete="username" maxlength="254" required>
                    <label for="identifier">Username or email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter a Password" autocomplete="current-password" maxlength="256" required>
                    <label for="password">Password</label>
                </div>
                <div class="mb-3 d-flex flex-wrap gap-2 justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                </div>

                </div>
                <button type="submit" class="btn btn-dark">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
