---
name: "Build Docker Image"
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  ci:
    uses: workflows/workflows/.gitea/workflows/ci.yaml@main
    with:
      repository: gpp-cdc-explorer
      context: .
      dockerfile: .dockerfile
    secrets: inherit
